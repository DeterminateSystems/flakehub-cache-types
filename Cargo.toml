[package]
name = "flakehub-cache-types"
version = "0.1.0"
edition = "2024"
description = "Types shared by FlakeHub Cache services"
license = "Apache-2.0"
repository = "https://github.com/DeterminateSystems/flakehub-cache-types"
publish = false

[lib]
name = "flakehub_cache_types"
path = "src/lib.rs"

[features]
default = []

# Enables `From<cxx::Exception>` for `StoreError`.
cxx = ["dep:cxx"]

# Enables the bloom filter types
bloom = ["dep:uuid", "dep:zerocopy"]

[dependencies]
cxx = { version = "1.0", optional = true }
displaydoc = "0.2.4"
hex = "0.4.3"
lazy_static = "1.4.0"
nix-base32 = "0.2.0"
regex = "1.8.3"
serde = { version = "1.0.163", features = ["derive"] }
serde_json = "1.0.96"
sha2 = "0.11.0"
uuid = { version = "1", features = ["serde"], optional = true }
zerocopy = { version = "0.8.55", features = ["derive"], optional = true }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
flakehub-cache-types = { path = ".", features = ["bloom"] }

[[bench]]
name = "snapshot_build"
harness = false
required-features = ["bloom"]
